# nginx на самой машине (Orange Pi, домашний сервер, VPS) перед контейнерами.
#
#   /etc/nginx/sites-available/lifeboard.conf
#   sudo ln -s /etc/nginx/sites-available/lifeboard.conf /etc/nginx/sites-enabled/
#
# Замените tracker.example.com на свой домен (во всех четырёх местах).
# В .env при этом должно быть:
#   WEB_SITE=:80  WEB_BIND=127.0.0.1  HTTP_PORT=8080  HTTPS_PORT=8443
#   APP_DOMAIN=tracker.example.com
#   APP_ORIGIN=https://tracker.example.com
#
# Сертификат получите ДО включения этого файла, иначе nginx не запустится:
#   sudo certbot certonly --webroot -w /var/www/html -d tracker.example.com

server {
	listen 80;
	listen [::]:80;
	server_name tracker.example.com;

	# продление сертификата ходит по http — этот путь не редиректим
	location /.well-known/acme-challenge/ {
		root /var/www/html;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	# nginx 1.25 и новее:
	#http2 on;
	# на nginx 1.18–1.24 вместо строки выше: listen 443 ssl http2;
	server_name tracker.example.com;

	ssl_certificate     /etc/letsencrypt/live/tracker.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/tracker.example.com/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;

	# синхронизация отправляет коллекции целиком; лимит сервера — 8 МБ на запрос
	client_max_body_size 12m;

	access_log /var/log/nginx/lifeboard.access.log;
	error_log  /var/log/nginx/lifeboard.error.log;

	# Внутри контейнера web сидит Caddy: он раздаёт статику и сам проксирует
	# /graphql и /healthz на api. Поэтому наружу нужен один upstream, а
	# заголовки безопасности, CSP и кэширование уже выставлены там —
	# дублировать их здесь не нужно.
	location / {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $host;
		proxy_read_timeout 60s;
	}
}
