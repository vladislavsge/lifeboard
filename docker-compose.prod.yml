# Prod: наружу смотрит только Caddy (80/443). MySQL и api портов не публикуют.
# Если снаружи стоит свой nginx, в .env добавьте:
#   WEB_SITE=:80  WEB_BIND=127.0.0.1  HTTP_PORT=8080  HTTPS_PORT=8443
# тогда Caddy раздаёт http только на 127.0.0.1:8080, а TLS делает nginx.
services:
  mysql:
    command: --skip-log-bin

  api:
    image: lifeboard-api
    environment:
      NODE_ENV: production
    # перед запуском накатываем миграции
    command: sh -c "npx prisma migrate deploy && node dist/index.js"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?задайте APP_DOMAIN в .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
      # адрес сайта для Caddy: домен (сам берёт сертификат) или :80 за своим прокси
      WEB_SITE: ${WEB_SITE:-${APP_DOMAIN}}
    ports:
      # обычно 0.0.0.0 и 80/443; WEB_BIND=127.0.0.1 прячет порты от сети —
      # это нужно, когда наружу смотрит nginx или туннель на самой машине.
      # Docker пишет свои правила iptables и ufw их не закрывает, поэтому
      # за прокси порты стоит публиковать именно на 127.0.0.1.
      - '${WEB_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80'
      - '${WEB_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443'
      - '${WEB_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443/udp'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_started

  # Ежедневный mysqldump в ./backups. Volume не должен быть единственной копией.
  backup:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lifeboard}
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      BACKUP_AT: ${BACKUP_AT:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ['/bin/bash', '/usr/local/bin/backup.sh']
    volumes:
      - ./docker/backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backups:/backups
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
